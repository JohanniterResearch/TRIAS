services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ambulanzsystem
      POSTGRES_USER: pls
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev-only-password}
    ports:
      # Host port 5434: 5432/5433 were already in use by unrelated local projects.
      - "127.0.0.1:${DB_HOST_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pls -d ambulanzsystem"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Production runs from deploy/ (Caddy, backups, install script); this file is dev/test only.

volumes:
  pgdata:
