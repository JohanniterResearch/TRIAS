# Production broker for the optional MQTT feed (PLS parity plan WP 7.1), from the PLS deployment.
# Anonymous access is disabled; install.sh generates the password file when MQTT_ENABLED=true.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type warning
log_type error
